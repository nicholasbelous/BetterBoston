# Runs on every push and pull request: the same checks as `npm run check`.
# No secrets are needed. Without ANTHROPIC_API_KEY the app uses the rule-based plan.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Type check (generates route types first)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate score data (schema, SAMPLE never marked real)
        run: npm run validate:data

      - name: Production build
        run: npm run build
        env:
          LIVE_DATA_ENABLED: "false"
